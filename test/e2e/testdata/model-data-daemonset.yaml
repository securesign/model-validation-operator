apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model-data-setup
  labels:
    app: model-data-setup
spec:
  selector:
    matchLabels:
      app: model-data-setup
  template:
    metadata:
      labels:
        app: model-data-setup
    spec:
      serviceAccountName: model-data-setup
      terminationGracePeriodSeconds: 5
      containers:
        - name: model-setup
          image: model-validation-test-model:latest
          imagePullPolicy: IfNotPresent
          command: ["sh","-c"]
          args:
            - |
              echo "Setting up model data on node ${NODE_NAME}..."
              mkdir -p /data /keys
              cp -r /data/* /data/ 2>/dev/null || true
              cp -r /keys/* /keys/ 2>/dev/null || true
              find /data /keys -type d -exec chmod 755 {} + || true
              find /data /keys -type f -exec chmod 644 {} + || true
              echo "After copy:"
              ls -l /data || true
              ls -l /keys || true
              echo "Model data setup complete on node ${NODE_NAME}"
              # Keep running so DaemonSet stays active
              sleep infinity
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: model-data
              mountPath: /data
            - name: keys-data
              mountPath: /keys
          securityContext:
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: model-data
          hostPath:
            path: /tmp/e2e-model-data
            type: DirectoryOrCreate
        - name: keys-data
          hostPath:
            path: /tmp/e2e-keys-data
            type: DirectoryOrCreate
      tolerations:
        - operator: Exists
          effect: NoSchedule
