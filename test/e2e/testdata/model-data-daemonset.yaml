apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: model-data-setup
  namespace: e2e-webhook-test-ns
  labels:
    app: model-data-setup
spec:
  selector:
    matchLabels:
      app: model-data-setup
  template:
    metadata:
      labels:
        app: model-data-setup
    spec:
      containers:
      - name: model-setup
        image: model-validation-test-model:latest
        imagePullPolicy: Never
        command:
        - sh
        - -c
        - |
          set -eu
          echo "Setting up model data on node $NODE_NAME..."
          mkdir -p /host-data /host-keys /host-fixtures
          # Go module fixtures can be read-only. A restarted root container
          # without DAC_OVERRIDE must restore owner write access before copying.
          chmod -R u+rwX /host-data /host-keys /host-fixtures
          cp -r /data/* /host-data/
          cp -r /keys/* /host-keys/
          cp -r /fixtures/* /host-fixtures/
          # Make files readable by all users (validation-agent runs as UID 65532)
          chmod -R a+rX /host-data /host-keys /host-fixtures
          echo "Model data setup complete on node $NODE_NAME"
          touch /tmp/model-data-ready
          # Keep running so DaemonSet stays active
          sleep infinity
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/model-data-ready"]
          initialDelaySeconds: 1
          periodSeconds: 2
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: host-model-data
          mountPath: /host-data
        - name: host-keys-data
          mountPath: /host-keys
        - name: host-fixture-data
          mountPath: /host-fixtures
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: host-model-data
        hostPath:
          path: /tmp/e2e-model-data
          type: DirectoryOrCreate
      - name: host-keys-data
        hostPath:
          path: /tmp/e2e-keys-data
          type: DirectoryOrCreate
      - name: host-fixture-data
        hostPath:
          path: /tmp/e2e-fixture-data
          type: DirectoryOrCreate
      tolerations:
      - operator: Exists
        effect: NoSchedule
