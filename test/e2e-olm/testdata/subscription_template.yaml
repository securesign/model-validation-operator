apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  channel: {{.Channel}}
  name: {{.PackageName}}
  source: {{.CatalogSourceName}}
  sourceNamespace: {{.CatalogSourceNamespace}}
{{- if .StartingCSV}}
  startingCSV: {{.StartingCSV}}
{{- end}}
  installPlanApproval: Automatic
