apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  sourceType: grpc
  grpcPodConfig:
    securityContextConfig: restricted
  image: {{.Image}}
  displayName: Model Validation Operator Test Catalog
  publisher: E2E Tests
  updateStrategy:
    registryPoll:
      interval: 15m
