coverage:
  status:
    project:
      default:
        target: 35%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 70%
        threshold: 0%
        informational: false

flags:
  unit:
    carryforward: true
    paths:
      - api/
      - cmd/
      - internal/
  e2e:
    carryforward: true
    paths:
      - cmd/
      - internal/

flag_management:
  default_rules:
    carryforward: true
