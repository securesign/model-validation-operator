---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
  namespace: system
rules:
  - apiGroups: [""]
    resources: ["configmaps", "namespaces"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create","patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","update","watch"]
  - apiGroups: [""]
    resources: ["pods/finalizers"]
    verbs: ["update"]
  - apiGroups: ["ml.sigstore.dev"]
    resources: ["modelvalidations","modelvalidations/status","modelvalidations/finalizers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get","list","watch","create","update","patch","delete"]