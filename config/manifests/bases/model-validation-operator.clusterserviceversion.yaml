apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    containerImage: placeholder
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
    features.operators.openshift.io/disconnected: "false"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    operators.openshift.io/valid-subscription: '["Red Hat Trusted Artifact Signer"]'
    repository: https://github.com/securesign/model-validation-operator
    support: Red Hat
  name: model-validation-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ModelValidation is the Schema for the modelvalidations API.
      displayName: Model Validation
      kind: ModelValidation
      name: modelvalidations.ml.sigstore.dev
      version: v1alpha1
  description: Model Validation Operator
  displayName: Model Validation Operator
  icon:
  - base64data: ""
    mediatype: ""
  install:
    strategy: deployment
    spec:
      permissions:
        - serviceAccountName: controller-manager
          rules:
            - apiGroups: [""]
              resources: ["configmaps", "namespaces"]
              verbs: ["get","list","watch","create","update","patch","delete"]
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get","list","watch","create","update","patch","delete"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["create","patch"]
            - apiGroups: ["ml.sigstore.dev"]
              resources: ["modelvalidations","modelvalidations/status","modelvalidations/finalizers"]
              verbs: ["get","list","watch","create","update","patch","delete"]
      deployments: 
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: model-validation-operator
          control-plane: controller-manager
          name: model-validation-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            strategy: {}
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  control-plane: controller-manager
              spec:
                serviceAccountName: controller-manager
                containers:
                  - name: manager
                    image: quay.io/securesign/model-validation-operator@sha256:f83f483c935ebd883de6ba60348b5808cf3a498dccc619c8d91c3328e9e1d326
                    imagePullPolicy: IfNotPresent
                    args:
                      - --leader-elect
                    env:
                      - name: ENVIRONMENT
                        value: "production"
                      - name: LOG_LEVEL
                        value: "info"
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 200m
                        memory: 256Mi
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - model signing
  - signing
  - ai
  links:
  - name: Model Validation Operator
    url: https://github.com/sigstore/model-validation-operator
  maintainers:
  - email: nolear@redhat.com
    name: Nina Bongartz
  - email: ryordan@redhat.com
    name: Rachel Yordan
  - email: ifont@redhat.com
    name: Ivan Font
  - email: asiek@redhat.com
    name: Aleksy Siek
  - email: kconner@redhat.com
    name: Kevin Conner
  - email: sacm@redhat.com
    name: Sachin Sampras
  maturity: tech-preview
  minKubeVersion: 1.24.0
  provider:
    name: Red Hat
  version: 0.0.1-techpreview
