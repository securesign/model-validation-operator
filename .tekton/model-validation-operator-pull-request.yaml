apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/securesign/model-validation-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "main" 
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: model-validation-operator
    appstudio.openshift.io/component: model-validation-operator
    pipelines.appstudio.openshift.io/type: build
  name: model-validation-operator-on-pull-request
  namespace: rhtas-tenant
spec:
  params:
  - name: release-version
    value: "1.4.0"
  - name: image-version
    value: "1.0.0"
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/securesign/model-validation-operator:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfile.model-validation.rh
  - name: path-context
    value: .
  - name: build-platforms
    value:
    - linux/x86_64
  - name: hermetic
    value: "true"
  - name: build-source-image
    value: "true"
  - name: prefetch-input
    value: '{"type": "gomod", "path": "."}'
  - name: manager-pipelinerun-selector
    value: "appstudio.openshift.io/application=model-validation-operator,appstudio.openshift.io/component=model-validation-operator-agent,pipelinesascode.tekton.dev/sha={{revision}},pipelinesascode.tekton.dev/event-type in (pull_request,retest-all-comment)"
  - name: manager-registry-url
    value: registry.redhat.io/rhtas/model-validation-agent-rhel9
  - name: manager-build-arg-name
    value: AGENT_IMG
  pipelineRef:
    params:
    - name: url
      value: https://github.com/securesign/pipelines.git
    - name: revision
      value: add-manager-support-docker-build
    - name: pathInRepo
      value: pipelines/docker-build-multi-platform-oci-ta.yaml
    resolver: git
  taskRunTemplate:
    serviceAccountName: build-pipeline-model-validation-operator
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
